[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ac4-decoder"
version = "0.1.0"
description = "An AC-4 audio decoder written from ETSI TS 103 190, in Python and NumPy. Not affiliated with or endorsed by Dolby Laboratories."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ac4dec = "ac4.cli:main"

[tool.setuptools]
packages = ["ac4"]

[tool.setuptools.package-data]
ac4 = ["tables/*.json", "*.c"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
